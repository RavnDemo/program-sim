id: BRM-116
title: CSP bypass enables script-based XSS via username on a legacy page
vulnerability_information: |
  XSS on a legacy page, bypassing the Content-Security-Policy, via the username field.

  There's an older page in the app that carries a weaker/overridable CSP than the main SPA. The
  username is rendered there without encoding, and the CSP in force on that page doesn't block
  inline script, so a `<script>` payload in the username actually executes — not just an iframe
  trick.

  ### Steps
  1. Authenticate; set the username to a script payload (via the API path, to avoid the SPA's
     own filtering):
  ```http
  POST /profile HTTP/1.1
  Host: bramble.example
  Content-Type: application/x-www-form-urlencoded
  Cookie: token=<token>

  username=<script>alert(`xss`)</script>
  ```
  2. Navigate to the legacy page that renders the username.

  ### Observed
  The inline `<script>` runs — the legacy page's CSP doesn't carry the script-src restrictions
  the main app relies on, so the usual "CSP would have stopped this" defence isn't present here.
  This is a true script-execution XSS, not an iframe/javascript-URI workaround.

  Two defects compound: unencoded username output on that page, and a CSP that differs (weaker)
  from the rest of the app. CVSS ~7.4 High.
impact: |
  Inline-script XSS that defeats the app's CSP by living on a page whose policy is weaker,
  executing in the victim's authenticated session. Session theft and account actions, with the
  CSP safety net absent. High.
