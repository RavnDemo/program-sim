    message: Reproduced — the account came back with role admin and passed the admin endpoints. Escalating.
  - after: 20m
    by: team
    do: comment
    internal: true
    message: Mass assignment on registration; role must never be client-settable. Critical. Audit for any admin accounts created this way.
