id: BRM-072
title: Security-question password reset also covers Bjoern's internal account
vulnerability_information: |
  ## Summary
  The `reset-password` flow is gated solely by the account's security-question
  answer, with no email token. The same weakness applies to Bjoern's internal
  account; the answer is a low-entropy string recoverable from public context.

  ## Steps to reproduce
  ```
  POST {{base_url}}/rest/user/reset-password HTTP/1.1
  Content-Type: application/json

  {"email":"bjoern@bramble.example","answer":"West-2082","new":"newpass123!","repeat":"newpass123!"}
  ```

  ## Observed result
  `200 OK`; the account's password is changed to the supplied value and login
  with it succeeds. No email verification or token was involved.

  ## Root cause
  Reset authenticates on `hmac(answer) === stored.answer` alone. Security
  questions are not a secret and carry low entropy, so this is an account-takeover
  primitive for any account whose answer can be guessed or researched.
impact: |
  Account takeover of any user, including this internal account, through the
  security-question-only reset. Medium. Same defect class as the other reset
  reports; filing the internal-account case for completeness.
