    by: team
    do: comment
    internal: true
    message: Confirmed — debug/diagnostic surface isn't role-gated. Separate from the coupon injection. Medium.
  - after: 40m
    by: team
    do: state
    state: triaged
    message: Reproduced as a non-admin. Agreed the diagnostic output shouldn't be reachable without the admin role. Triaged, medium.
  - after: 10m
    by: team
    do: severity
    rating: medium
  - after: 7d
    by: team
    do: state
    state: resolved
    message: Fixed — the debug/diagnostic responses are now gated behind the admin role and refused for ordinary sessions. Thanks for flagging the authz gap rather than just the output.
  - after: 1d
