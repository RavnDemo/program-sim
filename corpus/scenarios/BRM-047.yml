    by: team
    do: comment
    internal: true
    message: Repro'd via the subtitle path. Needs the file-write to plant, but the sink is real and unencoded. Medium.
  - after: 1h
    by: team
    do: state
    state: triaged
    message: Confirmed. The subtitle text lands inside an inline script tag unescaped, and the closing-tag break-out works. Triaged.
