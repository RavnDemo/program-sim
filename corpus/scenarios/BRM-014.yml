id: BRM-014
title: Server access logs exposed and directory-listed under /support/logs
vulnerability_information: |
  ## Summary
  `/support/logs` serves a browsable directory index, and `/support/logs/:file` streams the raw server access logs. The access log records request lines including query strings, so it leaks tokens, reset links, and PII that passed through the URL.

  ## Steps to reproduce
  1. Browse the index:

  ```
  GET {{base_url}}/support/logs
  ```

  Returns an HTML directory listing of the log files.

  2. Fetch a log directly:

  ```
  GET {{base_url}}/support/logs/access.log
  ```

  Returns the plaintext access log. Rotated files (`access.log.2026-...`) are listed and downloadable the same way.

  ## Observed result
  Full server access history is readable unauthenticated. The log contains request URLs with sensitive query parameters — password-reset tokens, auth artifacts, and customer identifiers that were ever sent in a URL.

  ## Severity
  Unauthenticated disclosure of logs containing sensitive data and live/near-live tokens. CVSS ~7.5 (high). Note the `:file` handler blocks `/` but not other traversal vectors; even without traversal the log contents alone are the finding.
impact: |
  Anyone can read the server's access logs, harvesting reset tokens and PII logged in request URLs — directly usable for account takeover. High.
