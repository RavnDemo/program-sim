    do: state
    state: duplicate
    message: |
      This is the same underlying issue as {{report:BRM-019}}: the retrieval here relies on the poison-null-byte bypass of the `/ftp` extension filter, which was already reported and triaged. The backup file is just another file reachable through that one root cause, so we're closing this as a duplicate of {{report:BRM-019}}. The fix for that report will close this off too. Thanks for the thorough write-up — please do keep them coming.
