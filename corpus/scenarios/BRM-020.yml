id: BRM-020
title: Forgotten developer backup file retrievable from /ftp
vulnerability_information: |
  Hello team,

  Nice program! I was poking around the `/ftp` directory on {{base_url}} and found that a developer backup file is sitting there that really shouldn't be reachable. When I request it normally I get a `403` saying only `.md` and `.pdf` are allowed, but I found a way around that filter and pulled the file down anyway.

  ## What I did
  1. Requesting the backup directly is blocked:

  ```
  GET {{base_url}}/ftp/package.json.bak   -> 403
  ```

  2. But if I tack on an encoded null byte and a `.md` on the end, the filter is happy and the server hands me the real backup:

  ```
  GET {{base_url}}/ftp/package.json.bak%2500.md   -> 200
  ```

  ## What's in it
  It's a forgotten `package.json.bak` — basically an old copy of the dependency manifest. It reveals the full dependency list and version pins (including some old/odd-looking package names), which is handy reconnaissance and arguably shouldn't be exposed at all.

  I think this is high because exposing a developer backup leaks internal build details. Screenshots attached showing the 403 vs the successful download.
impact: |
  Exposure of a forgotten developer backup file reveals the application's full dependency manifest and internal build details, aiding further targeted attacks. I'd rate it high given it's an unintended file disclosure.
