id: BRM-031
title: 2FA TOTP secret stored in plaintext and retrievable, enabling 2FA takeover
vulnerability_information: |
  ## Summary
  The TOTP shared secret for accounts with 2FA enabled is stored in plaintext and is retrievable through the application rather than kept server-side only. With the raw secret, an attacker can generate valid 6-digit codes at will and defeat the second factor for the targeted user (`wurstbrot@bramble.example`).

  ## Steps to reproduce
  1. Obtain the stored TOTP secret for the target account (it is persisted in cleartext and exposed via the user/data surface rather than being write-only).
  2. Seed any authenticator / `oathtool` with the recovered base32 secret:

  ```
  oathtool --totp -b <recovered_secret>
  ```

  3. Complete the 2FA step for wurstbrot with the generated code:

  ```
  POST {{base_url}}/rest/2fa/verify
  {"tmpToken":"<from password step>","totpToken":"<generated>"}
  ```

  Verification succeeds; full login as the 2FA-protected account.

  ## Root cause
  The TOTP secret is stored unencrypted (CWE-312, cleartext storage of sensitive information) and is reachable, so the "something you have" factor is effectively known to anyone who can read it.

  ## Severity
  Defeats 2FA for any affected account; the secret should never be retrievable once provisioned. CVSS ~7.4 (high).
impact: |
  The second authentication factor is bypassable because its secret is stored in cleartext and retrievable — an attacker who reads it can mint valid codes and take over 2FA-protected accounts. High.
