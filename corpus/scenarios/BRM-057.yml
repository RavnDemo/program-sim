id: BRM-057
title: "CRITICAL: SQL Injection in search reveals hidden Christmas product!!!"
vulnerability_information: |
  Dear Security Team,

  I am excited to report a CRITICAL SQL Injection vulnerability in the product
  search feature of Bramble Market. Using this vulnerability I was able to reveal
  a hidden/deleted product (a "Christmas Special" offer from 2014) and even order
  it, proving full database manipulation.

  ## Proof of Concept
  1. Send the following request to the search endpoint:

  ```
  GET {{base_url}}/rest/products/search?q=')) UNION SELECT * FROM Products WHERE name LIKE '%Christmas%'--
  ```

  2. OBSERVE: a product that is normally hidden (soft-deleted) is returned in the
     results.
  3. I then added it to my basket by its id and completed checkout successfully.

  This proves the search field is fully injectable and that deleted records can
  be resurfaced and purchased.

  ## Impact
  CRITICAL SQL Injection allowing access to hidden database records and
  manipulation of the product catalogue.

  ## Remediation
  - Use parameterized queries.
  - Deploy a WAF.
  - Audit all database queries.

  Please confirm my bounty for this CRITICAL finding promptly.
impact: |
  Full SQL injection in the search endpoint exposing hidden records and allowing
  catalogue manipulation. CRITICAL.
