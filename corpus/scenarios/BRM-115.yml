    by: team
    do: comment
    internal: true
    message: Injectable operator is worth hardening, but the only demonstrated impact is server sleep/resource exhaustion = DoS, which is out of scope. N/A per policy; we'll harden the input internally.
  - after: 1d
    by: team
    do: state
    state: not-applicable
    message: Thanks for the report. The only impact demonstrated here is making the server sleep / consume resources — i.e. denial of service. DoS and resource-exhaustion testing is explicitly out of scope for this program per our policy, so we're marking this not-applicable. If you can show the same injection leading to data access, authentication bypass, or data modification (not just availability impact), please open a new report and we'll prioritise it. We'll tighten the operator handling internally regardless.
