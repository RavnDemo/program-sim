id: BRM-115
title: "CRITICAL: NoSQL injection lets attacker make the server sleep / full Denial of Service"
vulnerability_information: |
  Dear Security Team,

  I have discovered a CRITICAL NoSQL injection vulnerability that allows a remote attacker to
  force your server to sleep and hang, resulting in a COMPLETE DENIAL OF SERVICE of your entire
  platform.

  ### Steps to Reproduce
  1. Target the product review endpoint.
  2. Inject a NoSQL operator payload that causes the server to execute a long-running / sleeping
     operation.

  ### Proof of Concept
  ```
  POST /rest/products/reviews
  {"id":{"$where":"sleep(10000)"},"message":"x"}
  ```

  ### Observed Result
  The server hangs for the duration of the sleep. By sending many such requests an attacker can
  exhaust server resources and take the whole application offline. This is a CRITICAL
  availability vulnerability.

  ### Remediation
  - Sanitize all NoSQL inputs.
  - Reject query operators in user input.
  - Add rate limiting.
  - Deploy a WAF.
  - Conduct regular penetration testing.

  Please confirm CRITICAL severity and the bounty.
impact: |
  CRITICAL denial of service. A remote attacker can hang the server and take the platform fully
  offline. CVSS 9.0+.
timeline:
