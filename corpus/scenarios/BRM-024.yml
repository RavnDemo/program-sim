id: BRM-024
title: Arbitrary file write via zip-slip in the complaint file upload overwrites legal.md
vulnerability_information: |
  ## Summary
  The B2B complaint upload (`/file-upload`) accepts `.zip` archives and extracts them without validating entry paths. An archive entry with a traversal path (`../../ftp/legal.md`) is written to the resolved absolute path, overwriting arbitrary files the process can reach — classic zip-slip.

  ## Steps to reproduce
  1. Craft a zip whose single entry has a traversal name resolving to the target:

  ```
  entry name: ../../ftp/legal.md
  entry body: "pwned by nightjar"
  ```

  2. Upload it:

  ```
  POST {{base_url}}/file-upload
  Content-Type: multipart/form-data; boundary=...
  (file field: exploit.zip)
  ```

  3. Fetch the overwritten file:

  ```
  GET {{base_url}}/ftp/legal.md    -> now contains "pwned by nightjar"
  ```

  ## Root cause
  Extraction resolves each entry to an absolute path and writes it without confining to a safe extraction directory; there is no check that the resolved path stays inside the intended folder.

  ## Observed result
  `ftp/legal.md` is overwritten with attacker content, confirming arbitrary file write. The same primitive can target other writable paths the Node process can reach (config, source, startup files) → RCE-adjacent.

  ## Severity
  Unauthenticated arbitrary file write. Realistically a path to code execution/defacement. CVSS ~9.1 (critical).
impact: |
  An unauthenticated attacker can write arbitrary files on the server via a crafted zip, overwriting application files and plausibly escalating to code execution. Critical.
