id: BRM-113
title: "CRITICAL IDOR: Unauthorized access to user objects via sequential IDs (VelociShop Commerce Suite)"
vulnerability_information: |
  Dear Security Team,

  I am excited to responsibly disclose a CRITICAL Insecure Direct Object Reference (IDOR)
  vulnerability affecting your platform. This vulnerability allows a malicious actor to access
  and enumerate other users' private data by manipulating object identifiers, resulting in a
  massive data breach.

  ### Affected Component
  The vulnerability exists in the **VelociShop Commerce Suite** customer dashboard, specifically
  the `/api/v3/customers/{customerId}/wallet` and `/graphql` `getUserVault` resolver.

  ### Steps to Reproduce
  1. Log in to the ShopEasy Pro merchant console.
  2. Navigate to the `MyAccountWidget` component.
  3. Intercept the request to `/api/v3/customers/1001/wallet` and change the `customerId`.
  4. Observe you can read any customer's wallet and the `loyaltyVaultToken`.

  ### Proof of Concept
  ```
  GET /api/v3/customers/1002/wallet
  Authorization: Bearer <token>
  -> returns another customer's full wallet, PII, and saved cards
  ```

  ### Observed Result
  Complete horizontal privilege escalation across all customer accounts via the Commerce Suite
  API. This is a CRITICAL breach exposing all customer PII and payment data.

  ### Remediation
  - Implement object-level authorization.
  - Use non-sequential UUIDs.
  - Deploy a WAF.
  - Conduct regular penetration testing per OWASP API Top 10.

  Please confirm the CRITICAL severity and advise on the bounty tier.
impact: |
  CRITICAL horizontal privilege escalation and mass customer data breach via IDOR across the
  entire customer base. CVSS 9.8.
timeline:
