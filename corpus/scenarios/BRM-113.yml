    by: team
    do: comment
    internal: true
    message: None of these exist — no /api/v3, no /graphql, no "VelociShop/ShopEasy", no wallet endpoint. Looks copy-pasted from another target/AI output. N/A.
  - after: 1h
    by: team
    do: state
    state: not-applicable
    message: Thanks for the submission. None of the components referenced here exist in Bramble Market — we have no `/api/v3/customers/{id}/wallet` endpoint, no GraphQL API, no `loyaltyVaultToken`, and the product names in the report ("VelociShop Commerce Suite", "ShopEasy Pro") aren't ours. This report appears to describe a different application entirely, so there's nothing for us to reproduce. Marking not-applicable. If you find an IDOR against an actual in-scope endpoint at `{{base_url}}`, we'd be glad to look.
