id: BRM-033
title: Missing authorization on PUT /api/Products/:id allows product tampering
vulnerability_information: |
  ## Summary
  `PUT /api/Products/:id` updates product records without enforcing an admin/authorization check on the write. Any authenticated user can modify product fields — including the description HTML — of products they don't own and have no rights to edit.

  ## Steps to reproduce
  1. As an ordinary logged-in user, update a product's description to change the embedded link target:

  ```
  PUT {{base_url}}/api/Products/9
  Authorization: Bearer <ordinary_user_token>
  Content-Type: application/json

  {"description":"<a href=\"https://owasp.slack.com\" target=\"_blank\">More...</a>"}
  ```

  2. Response `200` with the updated product.
  3. Reload the O-Saft product page — the `href` inside the description now points at the attacker-chosen URL.

  ## Root cause
  The update route has no authorization gate distinguishing admins from regular users (CWE-285, improper authorization); it only requires a valid session.

  ## Observed result
  A non-privileged user tampered with catalogue content. Combined with the description being rendered as HTML, this is also a stored-content injection vector for phishing/redirect.

  ## Severity
  Authenticated broken authorization allowing catalogue tampering (integrity, plus phishing via altered links). CVSS ~7.1 (high).
impact: |
  Any logged-in user can alter product listings and the links shown to all shoppers, enabling defacement and phishing from trusted product pages. High.
timeline:
