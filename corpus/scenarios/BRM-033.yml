    by: team
    do: comment
    message: Reproduced — a regular account updated product 9. There's no authz gate on the write. Thanks, triaging.
  - after: 30m
    by: team
    do: state
    state: triaged
    message: Triaged high. Product writes will require admin authorization server-side.
  - after: 10m
