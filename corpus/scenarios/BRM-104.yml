    by: team
    do: comment
    internal: true
    message: This is the same /ftp listing + confidential file the reporter already filed in {{report:BRM-103}}, just retitled around the listing. Dupe of their own report.
  - after: 30m
    by: team
    do: state
    state: duplicate
    message: Thanks — this is the same /ftp directory-listing and exposed-document issue you already reported in {{report:BRM-103}}, which we're tracking there (listing being disabled and the file removed). Closing this one as a duplicate so everything stays in a single thread. No need to re-file aspects of the same finding separately — happy to track sub-parts in the original.
