id: BRM-097
title: Reflected XSS via the order-tracking id parameter
vulnerability_information: |
  Reflected XSS in the order-tracking result view.

  The `id` query parameter on the track-result page is reflected into the DOM without encoding.

  ### Repro
  1. Load the tracking result page with a payload in `id`:
     `{{base_url}}/#/track-result?id=<iframe src="javascript:alert(`xss`)">`
  2. The value is reflected and the payload executes.

  ### PoC
  ```
  {{base_url}}/#/track-result?id=%3Ciframe%20src%3D%22javascript%3Aalert%28%60xss%60%29%22%3E
  ```

  The id is taken from the query string and written into the view unescaped. Reflected, not
  stored — requires the victim to open an attacker-supplied link.

  CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N ~ 6.1. Medium.
impact: |
  Reflected XSS: a crafted tracking link executes script in the victim's authenticated context —
  session token theft, actions as the victim, credential phishing. Requires the victim to follow
  the link, hence medium rather than high.
