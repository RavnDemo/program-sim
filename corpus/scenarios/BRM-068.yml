id: BRM-068
title: Administrator account uses a trivially weak password and there is no password policy
vulnerability_information: |
  Hi team,

  This one's simple but serious: the administrator account can be logged into with
  a very weak, guessable password, and the app doesn't enforce any password
  strength policy at all. No SQL injection or trickery — just the actual
  credentials.

  ## Steps to reproduce
  1. Go to the login page at {{base_url}}.
  2. Enter:

  ```
  email:    admin@bramble.example
  password: admin123
  ```

  3. Click Login. You're in as the administrator.

  I also confirmed via the registration form that the app will happily accept
  equally weak passwords for new accounts — there's no minimum length, no
  complexity requirement, nothing rejecting "123456" or "password".

  ```
  POST {{base_url}}/rest/user/login
  {"email":"admin@bramble.example","password":"admin123"}
  ```
  returns a valid admin token.

  ## Observed result
  Full administrator access using an obvious password. The account was never
  forced onto a stronger credential and the platform sets no password rules.

  ## Impact
  An attacker guessing or brute-forcing a short list of common passwords gets
  full admin control. The absence of any password policy means the whole user
  base can sit on weak credentials. I'd rate this high.
impact: |
  The admin account is reachable with a common weak password, and no password
  policy protects any account. Trivial brute-force to full administrative
  takeover. High.
